<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Details | Breast Cancer DSS</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --primary-blue: #0d6efd;
            --accent-blue: #004ab3;
            --bg-light: #f4f7fa;
            --medical-grid: rgba(13, 110, 253, 0.04);
        }

        body {
            background-color: var(--bg-light);
            font-family: 'Inter', -apple-system, sans-serif;
            color: #334155;
            min-height: 100vh;

            background-image: 
                linear-gradient(var(--medical-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--medical-grid) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .navbar {
            background: rgba(13, 110, 253, 0.95) !important;
            backdrop-filter: blur(10px);
        }

        .details-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.06);
            border: 1px solid rgba(13, 110, 253, 0.1);
            padding: 3rem;
        }

        .doctor-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .doctor-item:hover {
            background: white;
            border-color: var(--primary-blue);
            transform: translateX(5px);
            transition: 0.3s;
        }

        .btn-back {
            border: 2px solid var(--primary-blue);
            color: var(--primary-blue);
            border-radius: 10px;
            padding: 10px 25px;
            text-decoration: none;
            font-weight: 600;
        }

        .btn-back:hover {
            background: rgba(13,110,253,0.05);
        }
    </style>
</head>

<body>

<!-- NAVBAR SAME AS YOUR CARE PAGE -->
<nav class="navbar navbar-expand-lg navbar-dark py-3">
    <div class="container">
        <span class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2">
            <i data-lucide="heart-pulse"></i>
            Breast Cancer DSS
        </span>

        <div class="ms-auto d-flex align-items-center">
            <a href="/" class="btn btn-link text-white text-decoration-none me-3">Home</a>
            <span class="text-white me-3">{{ session.get('user_name') }}</span>
            <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </div>
</nav>

<!-- MAIN CONTENT -->
<div class="container py-5">

    <div class="details-card mx-auto" style="max-width: 900px;" data-aos="fade-up">

        <!-- TITLE -->
        <h2 class="fw-bold mb-3">
            <i data-lucide="hospital" class="text-primary"></i>
            {{ hospital.hospital }}
        </h2>

        <!-- OPENING TIME -->
        <p class="text-primary fw-semibold mb-4 d-flex align-items-center gap-2">
            <i data-lucide="clock"></i>
            Opening Time: {{ hospital.opening_time }}
        </p>

        <hr>

        <!-- DOCTORS -->
        <h5 class="fw-bold mb-3 d-flex align-items-center gap-2">
            <i data-lucide="stethoscope"></i>
            Available Doctors
        </h5>

        {% for doc in hospital.doctors %}
            <div class="doctor-item">
                <span>
                    👨‍⚕️ {{ doc.name }}
                </span>
                <span class="text-muted">
                    {{ doc.time }}
                </span>
            </div>
        {% endfor %}

        <!-- BACK BUTTON -->
        <div class="mt-4">
            <a href="/care-support" class="btn-back">
                ← Back to Care Support
            </a>
        </div>

    </div>

</div>

<!-- JS -->
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
    lucide.createIcons();
    AOS.init({ duration: 1000, once: true });
</script>

</body>
</html>
